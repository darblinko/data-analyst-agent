[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "AI agent with code execution capabilities, built with LangGraph and Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core LangGraph and LLM libraries
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-core>=0.3.0",
    # Streamlit UI
    "streamlit>=1.39.0",
    # Environment variables
    "python-dotenv>=1.0.0",
    # Data analysis
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    # Financial data
    "yfinance>=0.2.44",
    # Visualization
    "matplotlib>=3.7.0",
    "plotly>=5.17.0",
    # Code syntax highlighting
    "pygments>=2.16.0",
    # Statistical analysis
    "scipy>=1.11.0",
    # HTTP requests
    "requests>=2.31.0",
]

[project.scripts]
data-analyst-agent = "app:main"

[tool.uv]
dev-dependencies = []
