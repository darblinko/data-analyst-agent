[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "LangGraph ReAct agent that answers data questions by writing Python and running it, with a Streamlit chat UI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mitchell Foutz" }]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.2",
    "langchain-openai>=1.1",
    "langchain-anthropic>=1.3",
    "streamlit>=1.54",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "yfinance>=0.2.44",
    "matplotlib>=3.7",
    "plotly>=5.17",
    "scipy>=1.11",
]

[project.urls]
Repository = "https://github.com/darblinko/data-analyst-agent"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analyst_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
