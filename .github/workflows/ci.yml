# Lint and test on every push and pull request. Tests run offline: the agent tests use
# the scripted replay model and the sample dataset, so no API key or network is needed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Ruff from uv.lock, so CI and a local `uv run ruff` apply the same rules.
      - run: uv sync --frozen --only-dev
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
